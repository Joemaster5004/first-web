services:

  web:
    build: .
    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.0

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: firstdb
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    restart: always

    depends_on:
      - db

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    ports:
      - "8090:80"

volumes:
  mysql_data:
